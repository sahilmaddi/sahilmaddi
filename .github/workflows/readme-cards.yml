name: README cards

on:
  schedule:
    - cron: "23 1 * * *"        # every morning, 06:53 IST
  workflow_dispatch:             # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - config.json
      - readme_extra.md
      - assets/**
      - fonts/**
      - scripts/**
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build embedded fonts (first run only)
        if: hashFiles('fonts/metrics.json') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          pip install -q fonttools
          python scripts/build_fonts.py fonts

      - name: Fetch contributions and pinned repos
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github_data.py

      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards data fonts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh README cards"
            git push
          fi
